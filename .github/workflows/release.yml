name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-cli-archives:
    name: Build CLI archives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME:-snapshot}"
          mkdir -p dist

          targets=(
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "${target}"
            name="md-grip_${version}_${goos}_${goarch}"
            binary="md-grip"
            archive="${name}.tar.gz"

            if [[ "${goos}" == "windows" ]]; then
              binary="md-grip.exe"
              archive="${name}.zip"
            fi

            workdir="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${workdir}/${binary}" \
              .

            cp LICENSE README.md "${workdir}/"

            if [[ "${goos}" == "windows" ]]; then
              (cd "${workdir}" && zip -q "../${archive}" "${binary}" LICENSE README.md)
              mv "$(dirname "${workdir}")/${archive}" "dist/${archive}"
            else
              tar -C "${workdir}" -czf "dist/${archive}" "${binary}" LICENSE README.md
            fi

            rm -rf "${workdir}"
          done

      - name: Upload CLI archives
        uses: actions/upload-artifact@v4
        with:
          name: cli-archives
          path: dist/*

  build-macos-app:
    name: Build candidate App and DMG
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run macOS host behavior suite
        run: make macos-test

      - name: Build candidate App and DMG
        run: make macos-candidate

      - name: Upload candidate App and DMG
        uses: actions/upload-artifact@v4
        with:
          name: MDGrip-macos-candidate-${{ github.ref_name }}
          path: |
            macos/.build/candidate/MDGrip-arm64.dmg
            macos/.build/candidate/MDGrip-x86_64.dmg

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs:
      - build-cli-archives
      - build-macos-app

    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v4
        with:
          name: cli-archives
          path: dist

      - name: Download candidate DMGs
        uses: actions/download-artifact@v4
        with:
          name: MDGrip-macos-candidate-${{ github.ref_name }}
          path: dist

      - name: Generate checksums covering every release asset
        run: (cd dist && sha256sum * > checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            > [!WARNING]
            > `MDGrip-arm64.dmg` and `MDGrip-x86_64.dmg` are candidate builds: ad-hoc signed and not notarized.
            > Clean-install verification is not complete; macOS may require manual approval to open them, and the standard end-user installation trust flow has not been validated.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
